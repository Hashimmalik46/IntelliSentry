<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004d4d"/>
      <stop offset="100%" stop-color="#006a6a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b3b3"/>
      <stop offset="100%" stop-color="#006a6a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Shield Base -->
  <path d="M256 72 L384 120 V248 C384 340 328 412 256 440 C184 412 128 340 128 248 V120 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="24" 
        stroke-linejoin="round" 
        filter="url(#glow)"/>

  <path d="M256 96 L360 136 V248 C360 324 314 384 256 408 C198 384 152 324 152 248 V136 Z" 
        fill="url(#shieldGrad)" />

  <!-- Biometric Lock / Sentinel Eye Pulse -->
  <circle cx="256" cy="240" r="56" fill="#ffffff" opacity="0.9" />
  <circle cx="256" cy="240" r="32" fill="#004d4d" />
  <circle cx="256" cy="240" r="14" fill="#00e6e6" />
  
  <!-- Geofence Sentinel Ring Arcs -->
  <path d="M200 240 A56 56 0 0 1 312 240" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <path d="M256 160 V184" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <path d="M256 296 V320" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
</svg>
