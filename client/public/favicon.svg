<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003d3d"/>
      <stop offset="50%" stop-color="#005a5a"/>
      <stop offset="100%" stop-color="#007a7a"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008080"/>
      <stop offset="100%" stop-color="#004d4d"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2f1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Glowing Shield Border -->
  <path d="M256 64 L400 118 V256 C400 354 338 428 256 456 C174 428 112 354 112 256 V118 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="16" 
        stroke-opacity="0.9"
        stroke-linejoin="round" 
        filter="url(#glow)"/>

  <!-- Inner Shield Fill -->
  <path d="M256 88 L376 134 V256 C376 338 322 404 256 428 C190 404 136 338 136 256 V134 Z" 
        fill="url(#shieldGrad)" 
        stroke="rgba(255,255,255,0.2)"
        stroke-width="4" />

  <!-- Sentinel Cyan Tech Ring Accent -->
  <circle cx="256" cy="260" r="130" fill="none" stroke="#00f2fe" stroke-width="6" stroke-dasharray="24 12" opacity="0.4" />

  <!-- Bold "IS" Branding Typography -->
  <text x="256" y="295" 
        font-family="Arial, Helvetica, sans-serif" 
        font-weight="900" 
        font-size="190" 
        fill="url(#textGrad)" 
        text-anchor="middle" 
        letter-spacing="-4">IS</text>

  <!-- Sentinel AI Dot Accent over the 'I' -->
  <circle cx="198" cy="155" r="16" fill="#00f2fe" />
  <circle cx="198" cy="155" r="8" fill="#ffffff" />

  <!-- Subtle Security Lock Arc at Bottom -->
  <path d="M220 340 H292" stroke="#00f2fe" stroke-width="10" stroke-linecap="round" opacity="0.9" />
</svg>
